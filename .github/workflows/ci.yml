name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rails, JavaScript and security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RAILS_ENV: test
      CI: "true"
      DATABASE_HOST: 127.0.0.1
      DATABASE_USERNAME: repartos_ci
      DATABASE_PASSWORD: repartos_ci_local
      RAILS_MAX_THREADS: 5
      PARALLEL_WORKERS: 2
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: repartos_ci
          POSTGRES_PASSWORD: repartos_ci_local
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repartos_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential libpq-dev libvips42t64 pkg-config

      - name: Ruby and gems
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1 (includes Ruby 3.4.12)
        with:
          bundler-cache: true

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Tests, style and audits
        run: bin/ci

      - name: Failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-failure-diagnostics
          path: |
            test-results/
            playwright-report/
            log/test.log
          if-no-files-found: ignore
          retention-days: 7
