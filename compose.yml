name: app_repartos

x-app: &app
  build: .
  image: app_repartos-development
  environment:
    RAILS_ENV: development
    DATABASE_HOST: db
    DATABASE_USERNAME: repartos
    DATABASE_PASSWORD: repartos_local
    RAILS_MAX_THREADS: 5
    PHOTON_URL: ${PHOTON_URL:-https://photon.komoot.io/api/}
    OSM_TILES_URL: ${OSM_TILES_URL:-}
    VROOM_URL: ${VROOM_URL:-}
    MULTIVEHICLE_OPTIMIZATION_ENABLED: ${MULTIVEHICLE_OPTIMIZATION_ENABLED:-false}
    OSRM_COVERAGE_BBOX: ${OSRM_COVERAGE_BBOX:-}
    CUSTOMER_IMPORT_MAX_MB: ${CUSTOMER_IMPORT_MAX_MB:-5}
    CUSTOMER_IMPORT_MAX_ROWS: ${CUSTOMER_IMPORT_MAX_ROWS:-5000}
    DRIVER_LOCATION_RETENTION_HOURS: ${DRIVER_LOCATION_RETENTION_HOURS:-24}
    OSRM_URL: ${OSRM_URL:-http://osrm:5000}
    OSRM_MAP_VERSION: ${OSRM_MAP_VERSION:-}
  volumes:
    - .:/rails
    - bundle:/usr/local/bundle
  depends_on:
    db:
      condition: service_healthy

services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    profiles: [routing]
    command: ["osrm-routed", "--algorithm", "mld", "--threads", "2", "--mmap=true", "--max-table-size", "101", "/data/current/region.osrm"]
    volumes:
      - ./storage/routing:/data:ro
    restart: unless-stopped
    mem_limit: ${OSRM_SERVE_MEMORY:-2g}
    cpus: 2
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "4", "-O", "/dev/null", "http://127.0.0.1:5000/nearest/v1/driving/-58.3816,-34.6037"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: repartos
      POSTGRES_PASSWORD: repartos_local
      POSTGRES_DB: app_repartos_development
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repartos -d app_repartos_development"]
      interval: 5s
      timeout: 5s
      retries: 20
  setup:
    <<: *app
    command: ["bin/rails", "db:prepare", "tailwindcss:build"]
  web:
    <<: *app
    ports:
      - "127.0.0.1:3006:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    command: ["bin/jobs"]
    depends_on:
      setup:
        condition: service_completed_successfully
  css:
    <<: *app
    command: ["bin/rails", "tailwindcss:watch[always]"]
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  postgres:
  bundle:
