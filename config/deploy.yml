<% deploy_host = ENV.fetch("DEPLOY_HOST") %>
service: app-repartos
image: app-repartos
minimum_version: 2.12.0
servers:
  web:
    hosts: [<%= deploy_host %>]
    env:
      clear:
        RUN_DB_PREPARE: "1"
    options:
      memory: 1536m
      cpus: 2
  jobs:
    hosts: [<%= deploy_host %>]
    cmd: bin/jobs
    proxy: false
    options:
      memory: 1536m
      cpus: 2
      health-cmd: "bin/jobs-healthy"
      health-interval: 30s
      health-timeout: 10s
      health-start-period: 60s
proxy:
  ssl: true
  host: <%= ENV.fetch("APP_HOST") %>
  app_port: 3000
  healthcheck:
    path: /up
    interval: 3
    timeout: 5
registry:
  server: localhost:5555
builder:
  arch: <%= ENV.fetch("DEPLOY_ARCH", "amd64") %>
  target: production
ssh:
  user: <%= ENV.fetch("DEPLOY_SSH_USER") %>
  keys_only: true
  config: true
env:
  clear:
    RAILS_ENV: production
    APP_HOST: <%= ENV.fetch("APP_HOST") %>
    DATABASE_HOST: app-repartos-db
    DATABASE_USERNAME: repartos
    OSRM_URL: http://app-repartos-osrm:5000
    MULTIVEHICLE_OPTIMIZATION_ENABLED: "false"
    VROOM_URL: ""
    GEOREF_API_URL: <%= ENV.fetch("GEOREF_API_URL", "https://apis.datos.gob.ar/georef/api/v2.0").inspect %>
    GEOREF_DAILY_LIMIT: <%= ENV.fetch("GEOREF_DAILY_LIMIT", "2000").inspect %>
    GEOREF_INTERVAL_MS: <%= ENV.fetch("GEOREF_INTERVAL_MS", "1000").inspect %>
    PHOTON_DAILY_LIMIT: <%= ENV.fetch("PHOTON_DAILY_LIMIT", "100").inspect %>
    PHOTON_INTERVAL_MS: <%= ENV.fetch("PHOTON_INTERVAL_MS", "1500").inspect %>
    GEMINI_ENABLED: <%= ENV.fetch("GEMINI_ENABLED", "false").inspect %>
    GEMINI_MODEL: <%= ENV.fetch("GEMINI_MODEL", "gemini-3.5-flash-lite").inspect %>
    GEMINI_DAILY_LIMIT: <%= ENV.fetch("GEMINI_DAILY_LIMIT", "100").inspect %>
    GEMINI_INTERVAL_MS: <%= ENV.fetch("GEMINI_INTERVAL_MS", "2000").inspect %>
    GEMINI_LOW_TEMPERATURE: <%= ENV.fetch("GEMINI_LOW_TEMPERATURE", "false").inspect %>
    GEOCODING_TIMEOUT_SECONDS: <%= ENV.fetch("GEOCODING_TIMEOUT_SECONDS", "10").inspect %>
    GEOCODING_CACHE_DAYS: <%= ENV.fetch("GEOCODING_CACHE_DAYS", "30").inspect %>
    GEOCODING_RELIABLE_SCORE: <%= ENV.fetch("GEOCODING_RELIABLE_SCORE", "90").inspect %>
    GEOCODING_AGREEMENT_METERS: <%= ENV.fetch("GEOCODING_AGREEMENT_METERS", "150").inspect %>
    GEOCODING_EXPECTED_RADIUS_KM: <%= ENV.fetch("GEOCODING_EXPECTED_RADIUS_KM", "50").inspect %>
    CUSTOMER_IMPORT_RETENTION_DAYS: <%= ENV.fetch("CUSTOMER_IMPORT_RETENTION_DAYS", "7").inspect %>
    GEOCODING_BBOX: <%= ENV.fetch("GEOCODING_BBOX", "").inspect %>
    PHOTON_URL: <%= ENV.fetch("PHOTON_URL", "https://photon.komoot.io/api/").inspect %>
    CUSTOMER_IMPORT_MAX_MB: <%= ENV.fetch("CUSTOMER_IMPORT_MAX_MB", "5") %>
    CUSTOMER_IMPORT_MAX_ROWS: <%= ENV.fetch("CUSTOMER_IMPORT_MAX_ROWS", "5000") %>
    DRIVER_LOCATION_RETENTION_HOURS: <%= ENV.fetch("DRIVER_LOCATION_RETENTION_HOURS", "24") %>
    ACTIVE_STORAGE_SERVICE: persistent
    RAILS_MAX_THREADS: 5
    WEB_CONCURRENCY: 1
    JOB_CONCURRENCY: 1
  secret:
    <% if %w[1 true yes on].include?(ENV.fetch("GEMINI_ENABLED", "false").downcase) %>
    - GEMINI_API_KEY
    <% end %>
    - SECRET_KEY_BASE
    - DATABASE_PASSWORD
volumes:
  - /var/lib/app-repartos/storage:/rails/storage
  - /var/lib/app-repartos/routing:/rails/storage/routing:ro
asset_path: /rails/public/assets
logging:
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
retain_containers: 3
deploy_timeout: 180
drain_timeout: 30
accessories:
  db:
    image: postgres:18-alpine
    host: <%= deploy_host %>
    env:
      clear:
        POSTGRES_USER: postgres
        POSTGRES_DB: postgres
      secret:
        - POSTGRES_PASSWORD
        - DATABASE_PASSWORD
    directories:
      - /var/lib/app-repartos/postgres:/var/lib/postgresql
    files:
      - config/deploy/init-databases.sh:/docker-entrypoint-initdb.d/10-app-databases.sh:ro
    options:
      memory: 1536m
      cpus: 2
      health-cmd: pg_isready -U postgres -d postgres
      health-interval: 10s
      health-timeout: 5s
      health-retries: 10
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    host: <%= deploy_host %>
    cmd: osrm-routed --algorithm mld --threads 2 --mmap=true --max-table-size 101 /data/current/region.osrm
    directories:
      - /var/lib/app-repartos/routing:/data:ro
    options:
      memory: <%= ENV.fetch("OSRM_SERVE_MEMORY", "2g") %>
      cpus: 2
      health-cmd: "wget -q -T 4 -O /dev/null http://127.0.0.1:5000/nearest/v1/driving/-58.3816,-34.6037"
      health-interval: 30s
      health-timeout: 5s
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  migrate: app exec --primary "bin/rails db:prepare"
  logs: app logs -f
