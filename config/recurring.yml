production:
  route_proposal_maintenance:
    class: RouteProposalMaintenanceJob
    schedule: every 5 minutes
  incident_photo_retention:
    class: IncidentPhotoRetentionJob
    schedule: every day at 4:20am
  commercial_opportunities:
    class: CommercialOpportunitiesJob
    schedule: every hour at minute 35
  reconcile_delivery_incidents:
    class: ReconcileDeliveryIncidentsJob
    schedule: every 6 hours at minute 45
  driver_location_retention:
    class: DriverLocationRetentionJob
    schedule: every hour at minute 22
  delivery_evidence_retention:
    class: DeliveryEvidenceRetentionJob
    schedule: every day at 4am
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
