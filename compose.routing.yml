# Optional existing multi-vehicle VROOM stack. Prepare/activate OSRM with
# bin/routing, then:
# docker compose -f compose.yml -f compose.routing.yml up -d osrm vroom web
services:
  web:
    environment:
      VROOM_URL: http://vroom:3000
      MULTIVEHICLE_OPTIMIZATION_ENABLED: "true"
      OSRM_URL: http://osrm:5000
  worker:
    environment:
      OSRM_URL: http://osrm:5000
      VROOM_URL: http://vroom:3000
      MULTIVEHICLE_OPTIMIZATION_ENABLED: "true"
  osrm:
    profiles: !reset []
    command: ["osrm-routed", "--algorithm", "mld", "--threads", "2", "--mmap=true", "--max-table-size", "1000", "/data/current/region.osrm"]
  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.15.0
    environment:
      VROOM_ROUTER: osrm
    volumes:
      - ./config/routing/vroom.yml:/conf/config.yml:ro
    depends_on:
      - osrm
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
